name: CI

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Full Linux gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Read versioned toolchain
        id: pins
        run: |
          echo "go=$(python3 -c 'import json; print(json.load(open("scripts/checks.json"))["toolchain"]["go"])')" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ steps.pins.outputs.go }}
      - name: Run shared full gate
        run: make check
      - name: Verify exact published release
        if: startsWith(github.ref, 'refs/tags/v')
        run: python3 scripts/check.py --profile published --version "$GITHUB_REF_NAME"
      - name: Preserve lane evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: check-evidence
          path: .check-results/
